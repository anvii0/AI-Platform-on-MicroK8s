services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rag-app:
    build:
      context: ./applications/rag-app
    ports:
      - "8080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      VLLM_BASE_URL: http://ollama:11434/v1
      RAG_BASE_MODEL: qwen2.5:1.5b
      RAG_MODEL: local-rag
      OTEL_SDK_DISABLED: "true"
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  qdrant-data:
  ollama-data: